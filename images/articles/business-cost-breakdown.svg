<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Illustrative order price and cost breakdown</title><desc id="desc">An example order sells for 500 rupees. Listed costs including an owner-time allowance total 350 rupees, leaving a 150 rupee adjusted planning contribution.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf3"/><stop offset="1" stop-color="#edf4f5"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a91f38"/><stop offset="1" stop-color="#d55766"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#171b36" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><circle cx="1085" cy="84" r="118" fill="#f5dcae" opacity=".38"/><circle cx="100" cy="620" r="130" fill="#bbdfdc" opacity=".32"/>
<text x="64" y="77" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#a91f38">ILLUSTRATIVE EXAMPLE</text><text x="64" y="130" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#171b36">Follow ₹500 through one order</text><text x="64" y="171" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Costs include an assigned value for the owner’s time.</text><text x="64" y="227" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#171b36">SELLING PRICE</text><text x="1055" y="227" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#171b36">₹500</text><defs><clipPath id="bar"><rect x="64" y="250" width="1072" height="38" rx="19"/></clipPath></defs><g clip-path="url(#bar)"><rect x="64" y="250" width="343.14000000000004" height="38" fill="#a91f38"/><rect x="407.04" y="250" width="42.980000000000004" height="38" fill="#cf6571"/><rect x="449.92" y="250" width="32.26" height="38" fill="#cf8733"/><rect x="482.08000000000004" y="250" width="75.14" height="38" fill="#4c9b94"/><rect x="557.12" y="250" width="214.5" height="38" fill="#7786a5"/><rect x="771.52" y="250" width="42.980000000000004" height="38" fill="#d1a448"/><rect x="814.4" y="250" width="321.7" height="38" fill="#b6ddd4"/></g><circle cx="74" cy="325" r="9" fill="#a91f38"/><text x="92" y="333" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#596275">Materials</text><text x="92" y="366" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">₹160</text><circle cx="439" cy="325" r="9" fill="#cf6571"/><text x="457" y="333" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#596275">Packaging</text><text x="457" y="366" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">₹20</text><circle cx="804" cy="325" r="9" fill="#cf8733"/><text x="822" y="333" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#596275">Fees</text><text x="822" y="366" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">₹15</text><circle cx="74" cy="403" r="9" fill="#4c9b94"/><text x="92" y="411" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#596275">Delivery</text><text x="92" y="444" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">₹35</text><circle cx="439" cy="403" r="9" fill="#7786a5"/><text x="457" y="411" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#596275">Owner-time allowance</text><text x="457" y="444" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">₹100</text><circle cx="804" cy="403" r="9" fill="#d1a448"/><text x="822" y="411" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#596275">Waste / returns</text><text x="822" y="444" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">₹20</text><text x="64" y="488" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#a91f38">Costs plus owner-time allowance: ₹350</text><rect x="64" y="512" width="1072" height="72" rx="18" fill="#dcefe9"/><text x="88" y="558" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#171b36">Adjusted planning contribution</text><text x="1025" y="559" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#2f827b">₹150</text><text x="64" y="619" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#596275">Planning illustration only—not statutory profit or accounting/tax advice.</text><text x="64" y="649" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#596275">Replace every figure with actual records.</text></svg>
