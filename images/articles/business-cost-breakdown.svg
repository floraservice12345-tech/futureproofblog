<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Illustrative order price and cost breakdown</title><desc id="desc">An example order sells for 500 rupees. Listed costs including an owner-time allowance total 350 rupees, leaving a 150 rupee adjusted planning contribution.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf3"/><stop offset="1" stop-color="#edf4f5"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a91f38"/><stop offset="1" stop-color="#d55766"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#171b36" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><circle cx="1085" cy="84" r="118" fill="#f5dcae" opacity=".38"/><circle cx="100" cy="620" r="130" fill="#bbdfdc" opacity=".32"/>
<text x="64" y="83" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#a91f38">ILLUSTRATIVE EXAMPLE</text><text x="64" y="137" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#171b36">Follow ₹500 through one order</text><text x="64" y="176" font-family="Arial,sans-serif" font-size="20" fill="#596275">Costs include an assigned value for the owner’s time.</text>
<rect x="64" y="220" width="1070" height="250" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><text x="100" y="275" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#171b36">SELLING PRICE</text><text x="1090" y="275" text-anchor="end" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#171b36">₹500</text>
<rect x="100" y="300" width="930" height="36" rx="18" fill="#edf0f5"/><rect x="100" y="300" width="298" height="36" rx="18" fill="#a91f38"/><rect x="398" y="300" width="37" height="36" fill="#cf6571"/><rect x="435" y="300" width="28" height="36" fill="#df9c55"/><rect x="463" y="300" width="65" height="36" fill="#4c9b94"/><rect x="528" y="300" width="186" height="36" fill="#7786a5"/><rect x="714" y="300" width="37" height="36" rx="18" fill="#d1a448"/><rect x="751" y="300" width="279" height="36" rx="18" fill="#e6f3f0"/>
<text x="100" y="383" font-family="Arial,sans-serif" font-size="18" fill="#596275">Materials ₹160 · Packaging ₹20 · Fees ₹15 · Delivery ₹35</text><text x="100" y="416" font-family="Arial,sans-serif" font-size="18" fill="#596275">Owner-time allowance ₹100 · Waste/returns ₹20</text><text x="100" y="451" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#a91f38">Costs plus owner-time allowance: ₹350</text>
<rect x="64" y="505" width="1070" height="80" rx="18" fill="#eaf4f1"/><text x="100" y="555" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#171b36">Adjusted planning contribution</text><text x="1090" y="560" text-anchor="end" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#2f827b">₹150</text><text x="64" y="632" font-family="Arial,sans-serif" font-size="16" fill="#596275">Planning illustration only—not statutory profit or accounting/tax advice. Replace every figure with actual records.</text></svg>