<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Build an application from evidence</title><desc id="desc">A four-step illustrative framework, not a forecast or a guarantee.</desc><rect width="1200" height="660" fill="#edf4f1"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="60" font-size="20" font-weight="700" letter-spacing="3" fill="#246b58">FUTUREPROOF BLOG · A PRACTICAL FRAMEWORK</text><text x="48" y="128" font-size="43" font-weight="700" fill="#192238">Build an application from evidence</text><g transform="translate(48 205)"><rect width="536" height="166" rx="18" fill="white" stroke="#d6e1dc"/><circle cx="47" cy="47" r="23" fill="#246b58"/><text x="47" y="55" text-anchor="middle" fill="white" font-size="23" font-weight="700">1</text><text x="86" y="56" font-size="27" font-weight="700" fill="#192238">Choose a role</text><text x="29" y="116" font-size="23" fill="#566960">Your target role</text></g><g transform="translate(616 205)"><rect width="536" height="166" rx="18" fill="white" stroke="#d6e1dc"/><circle cx="47" cy="47" r="23" fill="#246b58"/><text x="47" y="55" text-anchor="middle" fill="white" font-size="23" font-weight="700">2</text><text x="86" y="56" font-size="27" font-weight="700" fill="#192238">Match real experience</text><text x="29" y="116" font-size="23" fill="#566960">Facts you can support</text></g><g transform="translate(48 401)"><rect width="536" height="166" rx="18" fill="white" stroke="#d6e1dc"/><circle cx="47" cy="47" r="23" fill="#246b58"/><text x="47" y="55" text-anchor="middle" fill="white" font-size="23" font-weight="700">3</text><text x="86" y="56" font-size="27" font-weight="700" fill="#192238">Write clearly</text><text x="29" y="116" font-size="23" fill="#566960">A focused application</text></g><g transform="translate(616 401)"><rect width="536" height="166" rx="18" fill="white" stroke="#d6e1dc"/><circle cx="47" cy="47" r="23" fill="#246b58"/><text x="47" y="55" text-anchor="middle" fill="white" font-size="23" font-weight="700">4</text><text x="86" y="56" font-size="27" font-weight="700" fill="#192238">Practise examples</text><text x="29" y="116" font-size="23" fill="#566960">Clear, honest answers</text></g><text x="48" y="634" font-size="18" fill="#566960">Original illustration · Use alongside the guide and its stated limitations.</text></g></svg>