<text x="64" y="77" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#a91f38">A SIMPLE FIELD GUIDE</text><text x="64" y="130" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#171b36">Possible creator income routes</text><text x="64" y="171" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Eligibility, audience fit, disclosure and your offer determine the route.</text><g><rect x="64" y="210" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="108" cy="255" r="26" fill="#a91f38"/><text x="100" y="264" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">1</text><text x="154" y="254" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">Platform</text><text x="154" y="291" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Ads and Premium</text><text x="154" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Eligibility and review</text></g><g><rect x="624" y="210" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="668" cy="255" r="26" fill="#3b8e88"/><text x="660" y="264" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">2</text><text x="714" y="254" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">Audience</text><text x="714" y="291" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Support and Shopping</text><text x="714" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Features may vary</text></g><g><rect x="64" y="378" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="108" cy="423" r="26" fill="#b57621"/><text x="100" y="432" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">3</text><text x="154" y="422" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">Partners</text><text x="154" y="459" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Sponsorships</text><text x="154" y="493" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Disclose paid work</text></g><g><rect x="624" y="378" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="668" cy="423" r="26" fill="#171b36"/><text x="660" y="432" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">4</text><text x="714" y="422" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">Creator</text><text x="714" y="459" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Products and links</text><text x="714" y="493" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Explain commissions</text></g><rect x="64" y="548" width="1072" height="73" rx="16" fill="#e9efef"/><text x="88" y="577" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20283a">An income route is an option, not a promise of approval,</text><text x="88" y="606" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20283a">views or earnings.</text><text x="64" y="653" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#596275">Illustration: FutureProof Blog · Verify current rules and costs before acting.</text></svg>
