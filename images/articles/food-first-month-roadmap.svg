<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A careful first month</title><desc id="desc">Four practical steps before repeating a home-food sales test. Food licensing depends on the exact activity; complete applicable requirements before selling.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf3"/><stop offset="1" stop-color="#edf4f5"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a91f38"/><stop offset="1" stop-color="#d55766"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#171b36" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><circle cx="1085" cy="84" r="118" fill="#f5dcae" opacity=".38"/><circle cx="100" cy="620" r="130" fill="#bbdfdc" opacity=".32"/>
<text x="64" y="77" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#a91f38">A SIMPLE FIELD GUIDE</text><text x="64" y="130" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#171b36">A careful first month</text><text x="64" y="171" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Four practical steps before repeating a home-food sales test.</text><g><rect x="64" y="210" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="108" cy="255" r="26" fill="#a91f38"/><text x="100" y="264" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">1</text><text x="154" y="254" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">Choose</text><text x="154" y="291" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">One small menu</text><text x="154" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Cost portions and time</text></g><g><rect x="624" y="210" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="668" cy="255" r="26" fill="#3b8e88"/><text x="660" y="264" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">2</text><text x="714" y="254" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">Check</text><text x="714" y="291" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Permissions first</text><text x="714" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Confirm rules before sales</text></g><g><rect x="64" y="378" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="108" cy="423" r="26" fill="#b57621"/><text x="100" y="432" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">3</text><text x="154" y="422" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">Test</text><text x="154" y="459" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">A manageable batch</text><text x="154" y="493" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Take confirmed orders</text></g><g><rect x="624" y="378" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="668" cy="423" r="26" fill="#171b36"/><text x="660" y="432" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">4</text><text x="714" y="422" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">Review</text><text x="714" y="459" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Costs and feedback</text><text x="714" y="493" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Repeat only if it works</text></g><rect x="64" y="548" width="1072" height="73" rx="16" fill="#e9efef"/><text x="88" y="577" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20283a">Food licensing depends on the exact activity; complete applicable</text><text x="88" y="606" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20283a">requirements before selling.</text><text x="64" y="653" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#596275">Illustration: FutureProof Blog · Verify current rules and costs before acting.</text></svg>
