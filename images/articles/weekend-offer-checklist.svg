<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Make the first offer easy to assess</title><desc id="desc">Write down the exact output before quoting or booking a small service. Accept only work you can safely and competently deliver, and set terms before starting.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf3"/><stop offset="1" stop-color="#edf4f5"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a91f38"/><stop offset="1" stop-color="#d55766"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#171b36" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><circle cx="1085" cy="84" r="118" fill="#f5dcae" opacity=".38"/><circle cx="100" cy="620" r="130" fill="#bbdfdc" opacity=".32"/>
<text x="64" y="77" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#a91f38">A SIMPLE FIELD GUIDE</text><text x="64" y="130" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#171b36">Make the first offer easy to assess</text><text x="64" y="171" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Write down the exact output before quoting or booking a small service.</text><g><rect x="64" y="210" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="108" cy="255" r="26" fill="#a91f38"/><text x="100" y="264" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">1</text><text x="154" y="254" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">Who</text><text x="154" y="291" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">One audience</text><text x="154" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Who has the problem?</text></g><g><rect x="624" y="210" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="668" cy="255" r="26" fill="#3b8e88"/><text x="660" y="264" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">2</text><text x="714" y="254" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">What</text><text x="714" y="291" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">One deliverable</text><text x="714" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">What will they receive?</text></g><g><rect x="64" y="378" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="108" cy="423" r="26" fill="#b57621"/><text x="100" y="432" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">3</text><text x="154" y="422" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">When</text><text x="154" y="459" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">A clear deadline</text><text x="154" y="493" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">What inputs are needed?</text></g><g><rect x="624" y="378" width="512" height="146" rx="20" fill="#fff" stroke="#dce2ec" stroke-width="2" filter="url(#shadow)"/><circle cx="668" cy="423" r="26" fill="#171b36"/><text x="660" y="432" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">4</text><text x="714" y="422" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171b36">Price</text><text x="714" y="459" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">Fixed scope</text><text x="714" y="493" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#596275">State limits and changes</text></g><rect x="64" y="548" width="1072" height="73" rx="16" fill="#e9efef"/><text x="88" y="577" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20283a">Accept only work you can safely and competently deliver,</text><text x="88" y="606" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20283a">and set terms before starting.</text><text x="64" y="653" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#596275">Illustration: FutureProof Blog · Verify current rules and costs before acting.</text></svg>
